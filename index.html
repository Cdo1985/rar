<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Website</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Initial Interaction Overlay */
        #interaction-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #111;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            background-color: #222;
            color: #fff;
            border: 2px solid #444;
            cursor: pointer;
            border-radius: 5px;
        }
        .start-btn:hover {
            background-color: #333;
            border-color: #666;
        }

        /* The Hidden Pop-up Overlay */
        .scare-overlay {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.95); 
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            perspective: 1000px; 
            overflow: hidden;
            cursor: pointer;
        }

        /* Container for the main chaotic spider images */
        .spider-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            max-width: 90%;
            z-index: 10;
        }

        .spider-img {
            width: 45%;
            max-width: 400px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0px 0px 30px rgba(255, 0, 0, 0.8));
        }

        /* Scurrying Spiders Layer */
        .scurry-spider {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            object-fit: contain;
            filter: drop-shadow(0px 0px 8px rgba(0, 0, 0, 0.9));
        }

        /* Screaming Text */
        .scare-text {
            color: #ff0000;
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-top: 30px;
            font-family: 'Impact', sans-serif;
            letter-spacing: 10px;
            text-shadow: 0 0 10px #000, 0 0 30px #ff0000;
            z-index: 10;
        }

        /* --- ANIMATIONS --- */
        .chaotic-vibration {
            animation: violent-twitch 0.04s infinite linear;
        }

        @keyframes violent-twitch {
            0%   { transform: translate(6px, 6px)   rotate(4deg)   scale(1.15); }
            20%  { transform: translate(-10px, 9px)  rotate(2deg)   scale(1.2); }
            40%  { transform: translate(-3px, 8px)  rotate(5deg)   scale(1.1); }
            60%  { transform: translate(-11px, 3px)  rotate(3deg)   scale(1.25); }
            80%  { transform: translate(-5px, -8px) rotate(6deg)   scale(1.15); }
            100% { transform: translate(-2px, 7px)  rotate(0deg)   scale(1.1); }
        }

        /* Erratic scurrying trajectories */
        @keyframes scurry-track-1 {
            0%   { transform: translate(0, 0) rotate(0deg); }
            25%  { transform: translate(180px, -100px) rotate(45deg); }
            50%  { transform: translate(90px, 220px) rotate(-90deg); }
            75%  { transform: translate(-120px, 60px) rotate(180deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        @keyframes scurry-track-2 {
            0%   { transform: translate(0, 0) rotate(180deg); }
            30%  { transform: translate(-220px, 180px) rotate(90deg); }
            60%  { transform: translate(120px, -120px) rotate(270deg); }
            100% { transform: translate(0, 0) rotate(180deg); }
        }

        /* Tiny micro-vibration loop attached to scurrying spiders */
        .bug-twitch {
            animation: bug-shake 0.04s infinite linear;
        }
        @keyframes bug-shake {
            0% { margin: 2px 3px; }
            50% { margin: -3px -2px; }
            100% { margin: 2px 3px; }
        }

        /* Flash background */
        .flash-bg {
            animation: screen-flash 0.1s infinite alternate;
        }

        @keyframes screen-flash {
            0% { background-color: rgba(0, 0, 0, 0.98); }
            100% { background-color: rgba(50, 0, 0, 0.98); } 
        }

        .escape-hint {
            position: absolute;
            bottom: 20px;
            color: #444;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="interaction-overlay">
        <h2>This page contains media content.</h2>
        <button class="start-btn" onclick="startExperience()">Continue to Site</button>
    </div>

    <div style="text-align: center;">
        <h1>Loading Dashboard Content...</h1>
        <p>Please wait a moment while the system synchronizes.</p>
    </div>

    <div id="jumpscare" class="scare-overlay flash-bg" ondblclick="closeScare()">
        <div class="spider-container chaotic-vibration">
            <img class="spider-img" src="https://raw.githubusercontent.com/Cdo1985/rar/main/image-J7XYh5Cix5CceVeAtkuVXYSGgrhjDL.png" alt="Main Spider 1">
            <img class="spider-img" src="https://raw.githubusercontent.com/Cdo1985/rar/main/image-RNeZA4HfSA3N9Y5crEqj7FqjkHOG0L.png" alt="Main Spider 2">
        </div>
        
        <div class="scare-text chaotic-vibration">RUN</div>
        <div class="escape-hint">Double-Click to Escape</div>
    </div>

    <script>
        // Audio pointing directly to your repository asset
        const jumpScareAudio = new Audio('https://raw.githubusercontent.com/Cdo1985/rar/main/Scary%20Woman%20Screaming%20-%20Sound%20Effect%20(HD).mp3');
        const jumpscareOverlay = document.getElementById('jumpscare');

        // Scurrying spider variant arrays populated directly from your repo assets
        const scurrySpiderPool = [
            'https://raw.githubusercontent.com/Cdo1985/rar/main/image-iYSmCmyEzc2R25UGI9FNcOJsHWNCBM.png',
            'https://raw.githubusercontent.com/Cdo1985/rar/main/image-s5nwdmWGXtfhMsT3IzxOM9ShujveXM.png'
        ];

        function preSpawnSpiders() {
            const count = 40; // Bumped count slightly for better coverage using both assets
            for (let i = 0; i < count; i++) {
                const img = document.createElement('img');
                
                // Randomly alternate between your two scurrying spider image assets
                img.src = scurrySpiderPool[Math.floor(Math.random() * scurrySpiderPool.length)];
                img.classList.add('scurry-spider', 'bug-twitch');

                const size = Math.floor(Math.random() * 55) + 25; 
                img.style.width = `${size}px`;
                img.style.height = 'auto';
                img.style.top = `${Math.floor(Math.random() * 90)}vh`;
                img.style.left = `${Math.floor(Math.random() * 90)}vw`;

                const track = Math.random() > 0.5 ? 'scurry-track-1' : 'scurry-track-2';
                const duration = (Math.random() * 1.1 + 0.3).toFixed(2); 
                img.style.animation = `${track} ${duration}s infinite linear`;

                jumpscareOverlay.appendChild(img);
            }
        }

        // Generate the background DOM early
        preSpawnSpiders();

        function startExperience() {
            document.getElementById('interaction-overlay').style.display = 'none';
            jumpScareAudio.volume = 1.0;

            jumpScareAudio.play().catch(error => {
                console.error("Audio playback failed:", error);
            });

            setTimeout(() => {
                jumpscareOverlay.style.display = 'flex';
            }, 1200);
        }

        function closeScare() {
            jumpscareOverlay.style.display = 'none';
            jumpScareAudio.pause();
            jumpScareAudio.currentTime = 0;
        }
    </script>

</body>
</html>
